<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Rampart+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/20adcc27b8.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="appShell is-collapsed chat-collapsed">
        <!-- =================LEFT NAV================= -->
         <aside class="leftSideBar">
            <div class="brand">
                <button class="openSidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="logo">
                    CLIQUE
                </h1>
            </div>
            <div class="sidebarContent">
                <button class="createBttn" id="createBttn" type="button">
                    <i class="fa-regular fa-calendar-plus"></i>
                    <span>Make Plans</span>
                </button>
                <!-- home -->
                <nav class="nav">
                    <a class="nav-link" href="#dashboard" data-view="dashboard"> 
                        <i class="fa-regular fa-house"></i>
                        <span>Home</span>
                    </a>
                    <!-- plans -->
                    <button class="nav-Group" type="button" data-collapse="plans" aria-expanded="false">
                     <span class="group-left">
                        <i class="fa-regular fa-clock"></i>
                        <span class="downArrow">Plans</span>
                    </span>
                    <i class="fa-solid fa-angle-down group-chev"></i>
                    <i class="fa-regular fa-clock group-alt"></i>
                    </button>
                    <div class="nav-group-items" id="collapse-plans">
                        <button class="nav-sublink" type="button" data-view="plans" data-subview="current"><i class="fa-solid fa-person-circle-check"></i>
                          <span>Current</span></button>
                        <button class="nav-sublink" data-view="plans" type="button" data-subview="pending"><i class="fa-solid fa-hourglass-half"></i>
                            <span>Pending</span></button>
                      </div>
                      <a class="nav-link" href="#calendar" data-view="calendar">
                        <i class="fa-solid fa-calendar-day"></i>
                        <span>
                            Calendar
                        </span></a>
                        <!-- friends -->
                        <button class="nav-Group" type="button" data-collapse="friends" aria-expanded="false">
                            <span class="group-left">
                                <i class="fa-solid fa-user-group"></i>
                                <span class="downArrow">Friends</span>
                            </span>
                            <i class="fa-solid fa-angle-down group-chev"></i>
                            <i class="fa-solid fa-user-group group-alt"></i>
                        </button>
                        <div class="nav-group-items" id="collapse-friends">
                            <button class="nav-sublink" type="button" data-view="friends" data-subview="requests">
                                <i class="fa-solid fa-user-plus"></i><span>Requests</span>
                            </button>
                            <button class="nav-sublink" type="button" data-view="friends" data-subview="all"><i class="fa-regular fa-circle-user"></i>
                                <span>All Friends</span>
                            </button>
                            </div>
                            <!-- Setting Gear -->
                            <div class="nav-footer">
                                <button class="navSetting" type="button" data-view="setting" aria-label="Settings">
                                    <i class="fa-solid fa-gear"></i>
                                </button>
                            </div>
                </nav>
            </div>
         </aside>
         <!-- =================DASHBOARD================= -->
         <main class="main">
            <section id="dashboard" class="view is-active">
                <div class="container">
                    <div class="statsContainer">
                       <div class="details">
                             <h2 class="futurePlans" id="dashPlanTitle">
                              Create Plans
                             </h2>
                             <p id="dashPlanDates"> No Dates Yet</p>
                             <p id="confirmedAttendance">Party Confirmed</p>
                             <div id="progressBar">
                                 <div class="progressFill"></div>
                             </div>
                         </div>
                         <div class="progressRing">
                             <p id="numbers">
                                 2/3
                             </p>
                         </div>
                     </div> 
                 </div>
                 <form class="inviteForm">
                    <input type="text" name="" id="todo-input" placeholder="who pullling up">
                    <button type="submit" id="todo-button">
                        Invite
                    </button>
                </form>
                <div id="mainContainer"></div>
                <div class="todoContainer">
                    <div id="taskUpdate">
                        <div class="applyBttn">
                            <button type="button" class="checkBttn"> Confirm </button>
                        </div>
                        <div class="clearTask">
                            <button type="button" class="clearBttn"> Not Going </button>
                        </div>
                    </div>
                </div>        
            </section>
            <!-- =================ADD PEOPLE INPUT================= -->
            <section id="friends" class="view">
                <h2>Friends</h2>
                <p>Coming Soon</p>
            </section>
            <!-- =================CALENDAR================= -->
            <section id="calendar" class="view">
                <div class="calendar">
                    <nav class="calendar-header">
                        <button id="prevMonth" class="calendarButton">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <h2  id="monthLabel">November</h2>    
                        <button id="nextMonth" class="calendarButton">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>            
                    </nav>
                    <div class="weekdayRow">
                        <span>Sun</span>
                        <span>Mon</span>
                        <span>Tue</span>
                        <span>Wed</span>
                        <span>Thu</span>
                        <span>Fri</span>
                        <span>Sat</span>
                    </div>
                    <div id="calendarGrid" class="calendar-Grid"></div>
                       
                </div>
            </section>
            <!-- =================PLANS PAGE=================          --> 
            <section id="plans" class="view">
               <!-- placeholder will fill in -->
                <h2>Plans</h2>
                <p>coming soon</p>
            </section>
             <!-- =================SETTINGS PAGE=================          -->
              <section id="setting" class="view">
               <h2>Setting</h2>
               <p>Coming Soon</p>
              </section>
              <!-- ===================Message Page================= -->
              <section id="message" class="view">
                <h2>Chat</h2>
                <p>Coming Soon</p>
               </section>
         </main>
         <!-- =================RIGHT NAV=================          -->
          <aside class="sidebarChat" id="chatPanel">
            <header class="chatHeader">
                <button id="closeChat">X</button>
                <h3>Inbox</h3>
                <div class="new-chat-btn">
                    <button class="newChat"><i class="fa-regular fa-message"></i></button>
                    <span class="new-chat">New Chat</span>
                </div>
            </header>
            <footer class="chat-input">
                <input type="text" placeholder="Message..." disabled>
            </footer>
          </aside>
    </div>
    <!-- ==============MINI MODAL FOR CREATE PLANS=========== -->
    <div  class="modal-hidden" id="eventModal" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close">x</button>
            <form id="eventForm">
                <div class="taskField">
                    <input type="text" id="eventTitle" placeholder="Add Task or Event" />
                    <span class="titleUnderline"></span>
                </div>
                <div class="infoBlock">
                    <div class="locationPicker">
                        <span id="locEmblm"><i class="fa-solid fa-location-dot"></i></span>
                        <button class="locationBtn" type="button">Add Location</button>
                    </div>
                    <div class="selectDates">
                        <span id="clockEmblm"><i class="fa-regular fa-clock"></i></span>
                        <button class="datePicker leftDatePicker" data-date-role="start" type="button"><span id="startDateHolder">Date</span></button>
                        <span id="dash"><i class="fa-solid fa-minus"></i></span>
                        <button class="datePicker" data-date-role="end" type="button"><span id="endDateHolder">Date</span></button>
                    </div>
                    <div class="miniCalendar">
                        <nav class="calendar-header">
                            <button id="miniPrev" class="calendarButton">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <h3  id="miniMonthLabel">November</h3>    
                            <button id="miniNext" class="calendarButton">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>            
                        </nav>
                        <div class="weekdayRow">
                            <span>Sun</span>
                            <span>Mon</span>
                            <span>Tue</span>
                            <span>Wed</span>
                            <span>Thu</span>
                            <span>Fri</span>
                            <span>Sat</span>
                        </div>
                        <div id="miniGrid" class="calendar-Grid"></div> 
                    </div>
                </div>
                <div class="descriptionBox">
                    <span class="menuBar"><i class="fa-solid fa-bars"></i></span>
                    <textarea name="descripBox" id="descripBox" placeholder="Add Description"></textarea>
                    <span class="descUnderline"></span>
                </div>
                <div class="buttonHolder">
                    <button class="popUpBttn" type="button">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button type="submit">Save</button>
                </div>
                </form>
        </div>
    </div>
    <nav class="mobileNav" aria-label="Mobile Navigation">
        <a href="#dashboard" class="mobileNav_item" aria-label="dashboard">
            <i class="fa-solid fa-house"></i>
        </a>
        <a href="#calendar" class="mobileNav_item" aria-label="Calendar">
            <i class="fa-solid fa-calendar-day"></i>
        </a>
        <a href="#friends" class="mobileNav_item" data-view="friends" aria-label="Friends">
            <i class="fa-solid fa-user-group"></i>
        </a>
        <button class="mobileNav_item" type="button" data-view="setting" aria-label="Setting">
            <i class="fa-solid fa-gear"></i>
        </button>
        <button class="mobileNav_item" type="button" data-view="message" aria-label="Message">
            <i class="fa-regular fa-message"></i>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
